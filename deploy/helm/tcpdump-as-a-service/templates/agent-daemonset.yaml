apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tcpdump.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-agent
        {{- include "tcpdump.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      # hostPID=true is required: makes all host process PIDs visible inside the
      # agent pod so we can search /proc/*/cgroup for the target container's PID
      # and then nsenter into its network namespace.
      hostPID: true
      {{- if .Values.openshift.enabled }}
      # spc_t (Super Privileged Container) SELinux type tells CRI-O to skip
      # SELinux process labeling for this pod. Without this, runc fails with
      # "can't set process label: open /proc/thread-self/attr/exec: read-only
      # file system" on SELinux-enforcing OpenShift nodes.
      # The custom SCC (seLinuxContext: RunAsAny) permits this type.
      securityContext:
        seLinuxOptions:
          type: spc_t
      {{- end }}
      containers:
        - name: agent
          image: {{ .Values.image.agent }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.agent.httpPort }}
              name: http
          env:
            - name: HUB_WS_URL
              value: {{ include "tcpdump.hubWsUrl" . | quote }}
            - name: AGENT_HTTP_PORT
              value: {{ .Values.agent.httpPort | quote }}
            - name: CAPTURE_BASE_DIR
              value: "/captures"
            # Kubernetes downward API: injects the node name this pod runs on.
            # The agent sends this to the hub during registration so the hub knows
            # which node the agent covers.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # privileged=true is required for nsenter to enter other namespaces.
            # On OpenShift this is allowed by the SCC created in scc.yaml.
            privileged: true
          volumeMounts:
            # Mount the host /proc at /host/proc (NOT at /proc) so the container's
            # own /proc remains intact. Overwriting /proc with a read-only hostPath
            # causes CRI-O to fail with "can't set process label: read-only file
            # system" because it can't write /proc/thread-self/attr/exec at startup.
            # With hostPID: true the container already sees all host PIDs in its own
            # /proc; we only need this mount for the cgroup-file scan in capture.py.
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            # Writable directory on the node for pcap files.
            - name: captures
              mountPath: /captures
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.agent.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        # emptyDir provides a per-node temporary directory for pcap files.
        # Files here are cleaned up when the agent pod is deleted.
        - name: captures
          emptyDir: {}
      tolerations:
        # Run on all nodes including control-plane/master nodes
        - operator: Exists
