apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hub-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tcpdump.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.hub.secretKey | quote }}
  {{- if eq .Values.auth.mode "openshift" }}
  OAUTH_CLIENT_SECRET: {{ .Values.auth.openshift.clientSecret | quote }}
  {{- end }}
