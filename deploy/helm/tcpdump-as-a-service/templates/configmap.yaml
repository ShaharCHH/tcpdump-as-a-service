apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hub-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tcpdump.labels" . | nindent 4 }}
data:
  AUTH_MODE: {{ .Values.auth.mode | quote }}
  K8S_IN_CLUSTER: "true"
  K8S_NAMESPACE: {{ .Release.Namespace | quote }}
  HUB_WS_URL: {{ include "tcpdump.hubWsUrl" . | quote }}
  MAX_DURATION_MINUTES: {{ .Values.limits.maxDurationMinutes | quote }}
  MAX_CONCURRENT_CAPTURES: {{ .Values.limits.maxConcurrentCaptures | quote }}
  MAX_CONCURRENT_PER_USER: {{ .Values.limits.maxConcurrentPerUser | quote }}
  PCAP_STORAGE_PATH: "/pcaps"
  PCAP_TTL_HOURS: {{ .Values.pcap.ttlHours | quote }}
  PCAP_MAX_FILES: {{ .Values.pcap.maxFiles | quote }}
  PCAP_MAX_FILE_MB: {{ .Values.pcap.maxFileMB | quote }}
  PCAP_ROTATION_SECONDS: {{ .Values.pcap.rotationSeconds | quote }}
  AGENT_HTTP_PORT: {{ .Values.agent.httpPort | quote }}
  ADMIN_USERS: {{ .Values.hub.adminUsers | quote }}
  LOG_LEVEL: {{ .Values.hub.logLevel | quote }}
  {{- if eq .Values.auth.mode "openshift" }}
  OPENSHIFT_API_URL: {{ .Values.auth.openshift.apiUrl | quote }}
  OAUTH_CLIENT_ID: {{ .Values.auth.openshift.clientId | quote }}
  OAUTH_CALLBACK_URL: {{ .Values.auth.openshift.callbackUrl | quote }}
  {{- end }}
